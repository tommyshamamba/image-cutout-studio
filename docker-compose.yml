services:
  api:
    build:
      context: .
      args:
        WITH_MODEL: "false"   # set to "true" to install rembg (U²Net)
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./web:/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
